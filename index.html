// Hairline fractures branching from selected flagstones.
function floorCrack(x,z,seed=1){
  let pts=[],px=x,pz=z;
  for(let j=0;j<4;j++){
    const nx=px+Math.sin(seed*2.7+j*1.9)*(.22+j*.07);
    const nz=pz+Math.cos(seed*1.8+j*2.1)*(.2+j*.06);
    pts.push(new THREE.Vector3(px,-.078,pz),new THREE.Vector3(nx,-.078,nz));
    px=nx;pz=nz;
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  scene.add(new THREE.LineSegments(geo,crackMat));
}
for(let i=0;i<34;i++){
  const x=(Math.sin(i*17.13)*.5+.5)*28-14;
  const z=(Math.cos(i*9.71)*.5+.5)*28-14;
  if(Math.abs(x)<2.7&&Math.abs(z)<2.7)continue;
  floorCrack(x,z,i+3);
}

 const add=(geo,mat,pos,parentOrRot=skeleton,rotMaybe=null)=>{

function updateSummonText(){

function updateSummons(dt,t){
 for(let i=summons.length-1;i>=0;i--){
  const s=summons[i],p=s.mesh.position;
  if(s.life>0){s.life-=dt;if(s.life<=0){scene.remove(s.mesh);summons.splice(i,1);continue}}
  const target=nearestEnemy();
  if(target){
   const tx=target.mesh.position.x-p.x,tz=target.mesh.position.z-p.z,dist=Math.hypot(tx,tz)||.001;
   const desired=s.range*(s.kind==="archer"||s.kind==="army"&&i%2===1?1:.78);
   if(dist>desired+.18){p.x+=tx/dist*s.speed*dt;p.z+=tz/dist*s.speed*dt}
   else if(s.kind==="archer"||s.kind==="army"&&i%2===1){if(dist<desired-.8){p.x-=tx/dist*s.speed*.65*dt;p.z-=tz/dist*s.speed*.65*dt}}
   s.mesh.rotation.y=Math.atan2(tx,tz);
   s.attackCD-=dt;
   if(dist<=s.range+.25&&s.attackCD<=0){
    target.hp-=s.damage;
    if(target.hp<=0)killEnemy(target);
    s.attackCD=s.kind==="golem"?1.15:s.kind==="archer"?.82:.95;
    if(s.kind==="archer"||s.kind==="army"&&i%2===1){
     const shot=new THREE.Mesh(new THREE.OctahedronGeometry(.09),fxMats.cyan);
     shot.position.set(p.x,.95,p.z);
     const start=shot.position.clone(),end=new THREE.Vector3(target.mesh.position.x,1,target.mesh.position.z);
     addFX(shot,(o,q)=>o.position.lerpVectors(start,end,q),.22);
    }
   }
  }else{
   const dx=group.position.x-p.x,dz=group.position.z-p.z,d=Math.hypot(dx,dz);
   if(d>2.1){p.x+=dx/d*s.speed*.75*dt;p.z+=dz/d*s.speed*.75*dt}
  }
  s.rise=Math.min(1,(s.rise||0)+dt/.9);{const ez=1-Math.pow(1-s.rise,3);s.mesh.scale.set(.6+.4*ez,Math.max(.02,ez),.6+.4*ez)}s.mesh.position.y=.025*Math.sin(t*2.8+s.phase);
  const gait=Math.sin(t*(s.kind==="golem"?4.2:7.5)+s.phase);
  if(s.limbs){
   [-1,1].forEach(side=>{
    const leg=s.limbs["leg"+side],arm=s.limbs["arm"+side];
    if(leg)leg.rotation.x=(target?gait*side*.32:Math.sin(t*1.3+s.phase)*.025);
    if(arm)arm.rotation.x=(target? -gait*side*.2:Math.sin(t*1.1+s.phase)*.035);
   });
  }
 }
 updateSummonText();
}
